schemaVersion: 1
model:
  backend: pytorch
  variant: hit_small
  weights: ../models/hit_small.pth
  precision: fp16
geometry:
  viewWidthPx: 256
  viewHeightPx: 256
  boundarySamplesPerEdge: 65
  minFovDeg: 20.0
  maxFovDeg: 120.0
depth:
  enabled: true
  minValidRatio: 0.35
  maxDepthJumpRatio: 0.60
  colorization:
    mode: relief
    nearBrightness: 0.95
    farBrightness: 0.20
    reliefGain: 1.00
    edgeGain: 0.35
    smoothingKernel: 7
backendFusion:
  depthScoreWeight: 0.15
fusionHead:
  rgbInitWeight: 0.70
  depthInitWeight: 0.20
  contextInitWeight: 0.10
decisionGate:
  motionScoreWeight: 0.25
  scaleScoreWeight: 0.15
  depthConsistencyWeight: 0.10
evaluator:
  supportWeight: 0.25
  agreementWeight: 0.25
  minReacquireViews: 2
motion:
  minSamplesForVelocity: 2
  maxTangentSpanRad: 1.20
  huberDeltaRad: 0.15
  processNoiseRadPerSec: 0.04
  maxAngularSpeedRadPerSec: 2.0
  maxLogScaleRatePerSec: 1.0
tracking:
  acceptThreshold: 0.70
  uncertainThreshold: 0.45
  recoverAcceptThreshold: 0.80
  candidateMinScore: 0.40
  uncertainPatience: 2
  maxRecoveryFrames: 30
  stableFramesBeforeUpdate: 8
  windowLength: 5
  contextScale: 2.0
  contextMarginRatio: 0.15
  scaleClusterTolerance: 0.50
  maxPredictionHorizon: 3
  guardYawStepDeg: 120.0
  minViewsForCommit: 2
  sameFrameEscalationEnabled: true
  maxAttemptsPerFrame: 2
  maxViewsPerFrameTotal: 12
  uncertainFovScale: 1.25
  reacquireCooldownFrames: 2
recovery:
  maxViewsPerFrame: 12
  globalSearchInterval: 5
  ringRadii: [1.0, 1.75, 2.5]
  viewsPerRing: [4, 8, 12]
  cubeMapOverlapRatio: 0.10
  maxCoveredCells: 256
runtime:
  decodeQueueCapacity: 3
  inferRequestQueueCapacity: 1
  inferResponseQueueCapacity: 1
  resultQueueCapacity: 32
visualization:
  enabled: false
  outputRoot: ../outputs/visualization
  stages:
    - local_rgb
    - depth_rgb
    - backend_box
    - geometry_box
