schemaVersion: 1
model:
  backend: pytorch
  variant: hit_small
  weights: ../models/hit_small.pth
  precision: fp16
geometry:
  viewWidthPx: 256
  viewHeightPx: 256
  boundarySamplesPerEdge: 65
  minFovDeg: 20.0
  maxFovDeg: 120.0
depth:
  enabled: true
  minValidRatio: 0.35
  maxDepthJumpRatio: 0.60
  colorization:
    mode: relief
    nearBrightness: 0.95
    farBrightness: 0.20
    reliefGain: 1.00
    edgeGain: 0.35
    smoothingKernel: 7
backendFusion:
  depthScoreWeight: 0.15
fusionHead:
  rgbInitWeight: 0.70
  depthInitWeight: 0.20
  contextInitWeight: 0.10
decisionGate:
  motionScoreWeight: 0.25
  scaleScoreWeight: 0.15
tracking:
  acceptThreshold: 0.70
  uncertainThreshold: 0.45
  stableFramesBeforeUpdate: 8
  windowLength: 5
recovery:
  maxViewsPerFrame: 12
  globalSearchInterval: 5
runtime:
  decodeQueueCapacity: 3
  inferRequestQueueCapacity: 1
  inferResponseQueueCapacity: 1
  resultQueueCapacity: 32
visualization:
  enabled: false
  outputRoot: ../outputs/visualization
  stages:
    - local_rgb
    - depth_rgb
    - backend_box
    - geometry_box
