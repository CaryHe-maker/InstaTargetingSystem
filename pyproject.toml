[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instatarget"
version = "0.1.0"
description = "Spherical RGB-only single-object tracking system"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.11,<5",
  "PyYAML>=6,<7",
  "torch>=2.6,<2.7",
  "torchvision>=0.21,<0.22",
  "timm==0.5.4",
  "easydict>=1.13,<2",
]

[project.optional-dependencies]
hit = [
  "torch>=2,<3",
  "torchvision>=0.20,<1",
  "timm>=0.5.4",
  "yacs>=0.1.8",
  "easydict>=1.13,<2",
  "scipy>=1,<2",
  "pandas>=2,<4",
  "tensorboard>=2.18,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
run = "instatarget.app.commands:runMain"
getInstanceID = "instatarget.app.commands:getInstanceIdMain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"instatarget.vendor.hit" = ["LICENSE", "configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/instatarget/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
